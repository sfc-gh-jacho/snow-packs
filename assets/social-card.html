<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snow Packs social preview card (source)</title>
<!-- Source for social-card.png (1200x630). Regenerate with Playwright: open at 1200x630 and screenshot. -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
  background: radial-gradient(circle at 78% 45%, #1d6f9e 0%, #11567f 30%, #0b3554 62%, #071f33 100%); position: relative; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1.2px, transparent 1.2px); background-size: 26px 26px;
  mask-image: radial-gradient(ellipse at 78% 50%, black 20%, transparent 65%); }
.orbit { position: absolute; border: 1.5px solid rgba(117,212,245,.28); border-radius: 50%; }
.o1 { width: 470px; height: 470px; right: 95px; top: 80px; }
.o2 { width: 560px; height: 560px; right: 50px; top: 35px; border-style: dashed; opacity: .6; }
.copy { position: absolute; left: 80px; top: 92px; width: 640px; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 750; letter-spacing: .2em; color: #75d4f5; }
.hex { width: 34px; height: 37px; background: #29b5e8; clip-path: polygon(50% 0,94% 25%,94% 75%,50% 100%,6% 75%,6% 25%); position: relative; }
.hex::after { content: ""; position: absolute; inset: 9px; background: #0d3d5e; clip-path: inherit; }
.eyebrow { margin-top: 62px; font-size: 16px; font-weight: 750; letter-spacing: .2em; color: #75d4f5; }
h1 { margin-top: 40px; font-size: 112px; font-weight: 820; line-height: .95; letter-spacing: -.06em; }
h1 span { color: #29b5e8; }
.tag { margin-top: 26px; font-size: 34px; font-weight: 560; line-height: 1.3; letter-spacing: -.02em; }
.tag span { color: #8bdcfa; }
.pills { display: flex; gap: 12px; margin-top: 34px; }
.pill { font-size: 16px; font-weight: 700; letter-spacing: .14em; padding: 9px 16px; border-radius: 999px; border: 1.5px solid rgba(139,220,250,.55); color: #d6f3fd; background: rgba(41,181,232,.12); }
.stack { position: absolute; width: 270px; height: 322px; right: 196px; top: 154px; border-radius: 22px; }
.back { transform: rotate(15deg) translate(26px,-10px); background: #8fd9f4; border: 1px solid #b7e9fa; opacity: .9; }
.mid { transform: rotate(-11deg) translate(-22px,4px); background: #d8f2fc; border: 1px solid #f0fbff; }
.front { transform: rotate(3deg); background: #11567f; border: 1.5px solid #3b8fbd; padding: 30px; box-shadow: 0 30px 60px rgba(2,20,36,.55); }
.front .label { display: block; font-size: 11px; letter-spacing: .18em; color: #beecff; }
.front .bighex { display: block; width: 56px; height: 61px; margin: 26px 0; background: #29b5e8; clip-path: polygon(50% 0,94% 25%,94% 75%,50% 100%,6% 75%,6% 25%); }
.front strong { display: block; font-size: 30px; line-height: 1.12; letter-spacing: -.03em; }
.front .rule { margin-top: 24px; border-top: 1px solid #5d8da8; }
.front .steps { display: flex; justify-content: space-between; margin-top: 16px; font-size: 12px; letter-spacing: .14em; }
.front .steps i { font-style: normal; color: #8bdcfa; }
.url { position: absolute; left: 80px; bottom: 44px; font-size: 18px; color: rgba(214,243,253,.75); letter-spacing: .02em; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg,#29b5e8,#75d4f5 60%,#11567f); }
</style>
</head>
<body>
<div class="dots"></div><div class="orbit o1"></div><div class="orbit o2"></div>
<div class="copy">
  <div class="brand"><span class="hex"></span>INDUSTRY IDEAS, IN ACTION</div>
  <h1>Snow Packs<span>.</span></h1>
  <p class="tag">Ideas for your industry.<br><span>A head start for your business.</span></p>
  <div class="pills"><span class="pill">SEE</span><span class="pill">TRY</span><span class="pill">DEPLOY</span></div>
</div>
<div class="stack back"></div><div class="stack mid"></div>
<div class="stack front"><span class="label">YOUR NEXT IDEA / 001</span><span class="bighex"></span><strong>One idea.<br>Many possibilities.</strong><div class="rule"></div><div class="steps"><span>SEE</span><i>&rarr;</i><span>TRY</span><i>&rarr;</i><span>DEPLOY</span></div></div>
<p class="url">sfc-gh-ooral.github.io/snow-packs</p>
<div class="bar"></div>
</body>
</html>
